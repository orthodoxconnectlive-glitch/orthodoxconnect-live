<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Call Notifications — OrthodoxConnect</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1c1611; color: #f5ebd9; padding: 24px; max-width: 600px; margin: 0 auto; }
  h1 { color: #d4a24e; font-size: 20px; }
  p { font-size: 14px; line-height: 1.6; color: #a89379; }
  button { margin-top: 20px; padding: 14px 28px; border: none; border-radius: 12px; background: #b45309; color: white; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; }
  button:disabled { opacity: 0.5; }
  #result { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  #result.ok { display: block; background: #14532d; color: #bbf7d0; }
  #result.err { display: block; background: #7f1d1d; color: #fecaca; }
  #result.info { display: block; background: #1e3a5f; color: #bfdbfe; }
</style>
</head>
<body>
  <h1>🔔 Reset Call Notifications</h1>
  <p>Tap the button below. It will remove your old call alert registration and create a fresh one. <b>Do this on the phone that should ring</b> (the receiving device).</p>
  <button id="reset" onclick="resetPush()">Reset Call Notifications</button>
  <div id="result"></div>

<script>
const VAPID_PUBLIC_KEY = 'BDrZbE-xWZdI4bykRXZG1pZRSV1g4_zxXVLzZvBISWGEsLuluW5G0nTNatg8MqBNcsoZLLApuLPk6RHyjJHPQ98';
const USER_ID = '9e63fd72-f7c1-4748-b463-1137b469c7f5';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function resetPush() {
  const btn = document.getElementById('reset');
  const res = document.getElementById('result');
  btn.disabled = true;
  const show = (cls, msg) => { res.className = cls; res.textContent = msg; };
  try {
    show('info', 'Working…');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      show('err', '❌ Push not supported in this browser.'); btn.disabled = false; return;
    }
    const reg = await navigator.serviceWorker.ready;
    // 1. Remove old subscription
    const oldSub = await reg.pushManager.getSubscription();
    if (oldSub) { try { await oldSub.unsubscribe(); } catch (e) {} }
    // 2. Ask permission
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { show('err', '❌ Notification permission denied. Enable it in browser settings.'); btn.disabled = false; return; }
    // 3. Subscribe fresh
    show('info', 'Creating fresh registration…');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const sj = sub.toJSON();
    const endpoint = sj.endpoint || '';
    const p256dh = (sj.keys && sj.keys.p256dh) || '';
    const auth = (sj.keys && sj.keys.auth) || '';
    if (!endpoint || !p256dh || !auth) { show('err', '❌ Failed to create subscription.'); btn.disabled = false; return; }
    // 4. Clear old server registrations
    await fetch('/api/push-subscriptions', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: USER_ID, clear_all: true }),
    }).catch(() => {});
    // 5. Register new
    const regRes = await fetch('/api/push-subscriptions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: USER_ID, subscription: { endpoint, keys: { p256dh, auth } } }),
    });
    if (!regRes.ok) { show('err', '❌ Server registration failed.'); btn.disabled = false; return; }
    // 6. Test push
    show('info', 'Sending test ring…');
    const testRes = await fetch('/api/push-subscriptions/test', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: USER_ID }),
    });
    if (testRes.ok) {
      show('ok', '✅ Done! Your phone is registered. You should have received a test notification. Now close this page and test a real call.');
    } else {
      show('ok', '✅ Registered! (Test send skipped.) Now close this page and test a real call.');
    }
  } catch (e) {
    show('err', '❌ Error: ' + (e.message || 'unknown'));
  }
  btn.disabled = false;
}
</script>
</body>
</html>
