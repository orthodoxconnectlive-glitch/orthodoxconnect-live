# Cloudflare Workers & D1 Configuration for OrthodoxConnect
name = "orthodoxconnect"
main = "src/worker.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "orthodoxconnect"
database_id = "cc2a30b0-43f6-4485-a2d7-8ca4e8e8a4fe"
migrations_dir = "migrations"

[triggers]
crons = ["0 12 * * *", "*/3 * * * *"]

# Public Google OAuth client ID for Sign in with Google (NOT a secret).
# Hany creates this in Google Cloud Console (OAuth client ID, Web application)
# and pastes the value here; the button stays hidden until it is set.
[vars]
GOOGLE_CLIENT_ID = ""
